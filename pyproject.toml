[project]
name = "dimarts"
version = "0.1.0"
requires-python = ">=3.14, <3.15"
dependencies = [
    "alembic==1.18.4",
    "fastapi==0.136.3",
    "langchain==1.3.2",
    "langgraph==1.2.2",
    "langsmith==0.8.8",
    "psycopg[binary]==3.3.4",
    "redis==8.0.0",
    "sqlalchemy[asyncio]==2.0.50",
]

[tool.uv]
add-bounds = "major"

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "strict"
include = ["app"]
exclude = [
  "**/__pycache__",
]
reportMissingImports = "error"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pyright==1.1.410",
    "pytest==9.0.3",
    "ruff==0.15.15",
]
